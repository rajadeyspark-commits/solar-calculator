name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unpack Project
        run: |
          unzip -o Udayan_Solar_Calculator_Android_Studio_Project.zip

      - name: Build APK
        run: |
          cd UdayanSolarApp
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solar-calculator-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
